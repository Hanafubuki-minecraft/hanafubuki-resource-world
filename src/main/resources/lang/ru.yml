# Style: https://github.com/Hanafubuki-minecraft/hanafubuki-brand/blob/main/STYLE.md
# Colors: <accent> <text> <muted> <dim> <success> <error> <gold>, symbol: <symbol> — palette in config.yml → style
# Русские сообщения HanafubukiResourceWorld
# Формат: MiniMessage — https://docs.advntr.dev/minimessage/format.html
prefix: "<accent><symbol></accent> "

time-format: "<days> д <hours> ч <minutes> мин"

players-only: "<error>Эта команда только для игроков."
no-permission: "<error>Недостаточно прав."
world-missing: "<error>Мир ресурсов сейчас недоступен."

reset-countdown: "<muted>Мир ресурсов обновится через <text><time></text>. Всё, что там останется, исчезнет."
reset-kicked: "<gold>Мир ресурсов обновляется — тебя перенесло на спавн."
reset-done: "<success>Мир ресурсов обновлён. Новые земли ждут!"
reset-confirm: "<gold>Мир ресурсов будет стёрт. Повтори <text>/<label> reset</text> в течение 15 секунд для подтверждения."

bed-blocked: "<gold>Здесь кровать не сохраняет точку возрождения — мир ресурсов сбрасывается."
portal-blocked: "<error>Порталы в Незер и Энд в мире ресурсов не работают."

teleport-searching: "<muted>Ищем безопасное место…"
teleport-failed: "<error>Не удалось найти безопасное место. Попробуй ещё раз."

info: "<muted>Мир <text><world></text> · сброс через <text><time></text> (<date>) · портал <text><portal>"
usage-portal: "<error>Использование: <text>/<label> portal detect | pos1 | pos2 | save | enable | disable | clear"
portal-pos-set: "<success><pos> установлен: <text><xyz></text>."
portal-saved: "<success>Область портала сохранена, портал включён."
portal-need-positions: "<error>Сначала задай pos1 и pos2 в одном мире и выполни save."
portal-enabled: "<success>Портал включён."
portal-disabled: "<gold>Портал выключен."
portal-detected: "<success>Проём портала найден: <text><size></text>. Сохранён и включён."
portal-detect-failed: "<error>Вокруг нет замкнутой рамки. Встань внутрь проёма или задай углы через pos1/pos2."
portal-cleared: "<success>Область портала удалена."

language-current: "<muted>Текущий язык: <text><language></text>. Доступны: <text><available>"
language-set: "<success>Язык изменён на <text><language></text>."
language-unknown: "<error>Неизвестный язык <text><language></text>. Доступны: <text><available>"
reloaded: "<success>Конфигурация перезагружена."

help-header: "<success>Мир ресурсов:"
help-info: "<muted> /<label> info <dim>—</dim> мир, следующий сброс, портал"
help-reset: "<muted> /<label> reset <dim>—</dim> сбросить мир сейчас"
help-portal: "<muted> /<label> portal detect <dim>—</dim> встань в арку, проём найдётся сам"
help-language: "<muted> /<label> language [код] <dim>—</dim> сменить язык"
help-reload: "<muted> /<label> reload <dim>—</dim> перезагрузить конфиг"
