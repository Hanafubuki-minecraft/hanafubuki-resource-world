portal-enabled: "<green>Портал включён."
portal-disabled: "<yellow>Портал выключен."
portal-cleared: "<green>Область портала удалена."

language-current: "<gray>Текущий язык: <white><language></white>. Доступны: <white><available>"
language-set: "<green>Язык изменён на <white><language></white>."
