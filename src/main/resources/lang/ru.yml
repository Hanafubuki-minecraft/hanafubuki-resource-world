prefix: "<gray>[<#ffb7c5>Ресурсы</#ffb7c5>]</gray> "

time-format: "<days> д <hours> ч <minutes> мин"

players-only: "<red>Эта команда только для игроков."
no-permission: "<red>Недостаточно прав."
world-missing: "<red>Мир ресурсов сейчас недоступен."

reset-countdown: "<gray>Мир ресурсов обновится через <white><time></white>. Всё, что там останется, исчезнет."
reset-kicked: "<yellow>Мир ресурсов обновляется — тебя перенесло на спавн."
reset-done: "<green>Мир ресурсов обновлён. Новые земли ждут!"
reset-confirm: "<yellow>Мир ресурсов будет стёрт. Повтори <white>/<label> reset</white> в течение 15 секунд для подтверждения."

bed-blocked: "<yellow>Здесь кровать не сохраняет точку возрождения — мир ресурсов сбрасывается."
