# Style: https://github.com/Hanafubuki-minecraft/hanafubuki-brand/blob/main/STYLE.md
# Colors: <accent> <text> <muted> <dim> <success> <error> <gold>, symbol: <symbol> — palette in config.yml → style
# English messages for HanafubukiResourceWorld
# Format: MiniMessage — https://docs.advntr.dev/minimessage/format.html
prefix: "<accent><symbol></accent> "

time-format: "<days>d <hours>h <minutes>m"

players-only: "<error>Only players can use this command."
no-permission: "<error>You don't have permission to do that."
world-missing: "<error>The resource world isn't available right now."

reset-countdown: "<muted>The resource world resets in <text><time></text>. Anything left there will be gone."
reset-kicked: "<gold>The resource world is being reset — you've been moved to spawn."
reset-done: "<success>The resource world has been reset. Fresh land is waiting!"
reset-confirm: "<gold>This will wipe the resource world. Run <text>/<label> reset</text> again within 15 seconds to confirm."

bed-blocked: "<gold>Beds here don't set your respawn point — the resource world resets."
portal-blocked: "<error>Nether and End portals don't work in the resource world."

teleport-searching: "<muted>Looking for a safe spot…"
teleport-failed: "<error>Couldn't find a safe spot. Try again."

info: "<muted>World <text><world></text> · resets in <text><time></text> (<date>) · portal <text><portal>"
usage-portal: "<error>Usage: <text>/<label> portal detect | pos1 | pos2 | save | enable | disable | clear"
portal-pos-set: "<success><pos> set to <text><xyz></text>."
portal-saved: "<success>Portal area saved and enabled."
portal-need-positions: "<error>Set pos1 and pos2 in the same world and run save first."
portal-enabled: "<success>Portal enabled."
portal-disabled: "<gold>Portal disabled."
portal-detected: "<success>Portal opening found: <text><size></text>. Saved and enabled."
portal-detect-failed: "<error>No closed frame around you. Stand inside the opening, or set the corners with pos1/pos2."
portal-cleared: "<success>Portal area removed."

language-current: "<muted>Current language: <text><language></text>. Available: <text><available>"
language-set: "<success>Language set to <text><language></text>."
language-unknown: "<error>Unknown language <text><language></text>. Available: <text><available>"
reloaded: "<success>Configuration reloaded."

help-header: "<success>Resource world:"
help-info: "<muted> /<label> info <dim>—</dim> world, next reset, portal"
help-reset: "<muted> /<label> reset <dim>—</dim> reset the world now"
help-portal: "<muted> /<label> portal detect <dim>—</dim> stand in the arch, the opening is found automatically"
help-language: "<muted> /<label> language [code] <dim>—</dim> change language"
help-reload: "<muted> /<label> reload <dim>—</dim> reload config"
